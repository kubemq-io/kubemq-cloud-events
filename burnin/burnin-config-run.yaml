version: "2"

broker:
  address: "localhost:9090"
  client_id_prefix: "burnin-ce"

mode: "soak"
duration: "168h"
run_id: ""
warmup_duration: ""

ce:
  content_mode: "structured"
  base_url: ""

patterns:
  events:
    enabled: true
    channels: 1
    producers_per_channel: 1
    consumers_per_channel: 1
    consumer_group: false
    rate: 100

  events_store:
    enabled: true
    channels: 1
    producers_per_channel: 1
    consumers_per_channel: 1
    consumer_group: false
    rate: 100

  queues:
    enabled: true
    channels: 1
    producers_per_channel: 1
    consumers_per_channel: 1
    rate: 50

  commands:
    enabled: true
    channels: 1
    senders_per_channel: 1
    responders_per_channel: 1
    rate: 20

  queries:
    enabled: true
    channels: 1
    senders_per_channel: 1
    responders_per_channel: 1
    rate: 20

queue:
  poll_max_messages: 10
  poll_wait_timeout_seconds: 5
  max_depth: 1000000

rpc:
  timeout_ms: 5000

message:
  size_mode: "distribution"
  size_bytes: 1024
  size_distribution: "256:80,4096:15,65536:5"
  reorder_window: 10000

metrics:
  port: 8905
  report_interval: "30s"

logging:
  format: "text"
  level: "info"

forced_disconnect:
  interval: "0"
  duration: "5s"

recovery:
  reconnect_interval: "1s"
  reconnect_max_interval: "30s"
  reconnect_multiplier: 2.0

shutdown:
  drain_timeout_seconds: 10

output:
  report_file: ""
  sdk_version: ""

thresholds:
  max_loss_pct: 0.0
  max_events_loss_pct: 5.0
  max_duplication_pct: 0.1
  max_p99_latency_ms: 2000
  max_p999_latency_ms: 10000
  min_throughput_pct: 80
  max_error_rate_pct: 1.0
  max_memory_growth_factor: 2.0
  max_downtime_pct: 10
  max_ce_fidelity_failures: 0
  max_duration: "168h"

warmup:
  max_parallel_channels: 10
  timeout_per_channel_ms: 5000

cors:
  origins: "*"
